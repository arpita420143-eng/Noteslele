
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKS Sports Live</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>
<script src="https://cdn.dashjs.org/v4.7.4/dash.all.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial,sans-serif}
header{
 background:#111b2d;padding:17px 20px;
 display:flex;justify-content:space-between;align-items:center;
 border-bottom:1px solid #293750
}
.logo{font-size:23px;font-weight:bold;color:#ffca28}
.telegram{
 color:white;text-decoration:none;background:#168bd0;
 padding:9px 13px;border-radius:8px;font-size:13px
}
.container{max-width:1100px;margin:auto;padding:16px}
.search{
 width:100%;padding:15px;background:#142037;color:white;
 border:1px solid #34445f;border-radius:10px;margin-bottom:18px
}
.player{background:#000;border-radius:13px;overflow:hidden}
video{width:100%;aspect-ratio:16/9;display:block}
#status{padding:14px;color:#adb9cc;font-size:14px;min-height:45px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 25px}
select,button{
 background:#17243a;color:white;border:1px solid #34445f;
 padding:13px;border-radius:9px;font-size:15px
}
.controls select{flex:1;min-width:130px}
button{cursor:pointer}
h3{font-size:21px;margin:25px 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.item{
 background:#142037;border:1px solid #293b58;
 border-radius:12px;padding:13px;cursor:pointer;
 min-width:0
}
.item:hover{border-color:#ffca28}
.item img{
 width:100%;height:95px;object-fit:contain;
 margin-bottom:10px
}
.item strong{display:block;font-size:16px;line-height:1.3}
.item small{display:block;color:#9eacc4;margin-top:9px}
.active{border-color:#ffca28}
.empty{color:#8998b0;padding:12px}
footer{text-align:center;padding:24px;color:#8492aa}
@media(min-width:650px){
 .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>

<body>

<header>
 <div class="logo">MKS SPORTS</div>
 <a class="telegram" href="https://t.me/MKSsports_3"
 target="_blank">JOIN TELEGRAM</a>
</header>

<div class="container">

<input class="search" id="search"
placeholder="Search matches or channels...">

<div class="player">
 <video id="video" controls playsinline></video>
</div>

<div id="status">Connecting to sports servers...</div>

<div class="controls">
 <select id="sourceSelect">
  <option value="">Select Language / Source</option>
 </select>

 <select id="speed">
  <option value="1">Speed 1x</option>
  <option value="1.25">Speed 1.25x</option>
  <option value="1.5">Speed 1.5x</option>
  <option value="2">Speed 2x</option>
 </select>

 <button id="playButton">PLAY</button>
</div>

<h3>🏏 LIVE EVENTS</h3>
<div id="events" class="grid"></div>

<h3>📺 TV CHANNELS</h3>
<div id="channels" class="grid"></div>

</div>

<footer>
 MKS SPORTS © 2026<br>
 <a href="https://t.me/MKSsports_3"
 style="color:#35aaf0">Telegram Channel</a>
</footer>

<script>

// ===================================
// 1. JSON DATABASE
// ===================================

const JSON_URLS=[
 "https://rjson.snackonline223.workers.dev/events.json",
 "https://sonujson-v5.pages.dev/Data/sports.json",
 "https://sonujson-v7.pages.dev/Data/sports.json"
];

const video=document.getElementById("video");
const statusBox=document.getElementById("status");
const sourceSelect=document.getElementById("sourceSelect");

let eventsData=[];
let channelsData=[];
let selectedSources=[];
let currentIndex=0;
let hls=null;
let dash=null;
let playerAttempt=0;

// ===================================
// 2. STATUS
// ===================================

function status(message){
 statusBox.textContent=message;
}

// ===================================
// 3. FETCH ALL JSON SOURCES
// IMPORTANT: MERGE EVENTS + CHANNELS
// ===================================

async function loadDatabase(){

 status("Loading primary and backup databases...");

 for(const url of JSON_URLS){

  try{

   const response=await fetch(url,{
    cache:"no-store"
   });

   if(!response.ok)throw Error("HTTP "+response.status);

   const data=await response.json();

   if(Array.isArray(data.events)){
    eventsData.push(...data.events);
   }

   if(Array.isArray(data.channels)){
    channelsData.push(...data.channels);
   }

   console.log("Loaded:",url);

  }catch(error){

   console.warn("Database failed:",url,error);

  }
 }

 // Remove duplicate records
 function unique(items){

  const map=new Map();

  items.forEach(item=>{
   const id=item.id || item.name || item.title;
   if(id && !map.has(id))map.set(id,item);
  });

  return [...map.values()];
 }

 eventsData=unique(eventsData);
 channelsData=unique(channelsData);

 if(!eventsData.length&&!channelsData.length){
  status("All JSON servers failed. Check server availability.");
  return;
 }

 renderDatabase();

 status(
  "Database ready • "+
  eventsData.length+" Events • "+
  channelsData.length+" Channels"
);
}

// ===================================
// 4. NORMALIZE JSON STRUCTURES
// ===================================

function getStreamURL(item){

 if(typeof item==="string")return item;

 if(!item || typeof item!=="object")return "";

 return item.stream_url ||
        item.url ||
        item.file ||
        item.src ||
        item.link ||
        item.play_url || "";
}

function getSources(item){

 if(!item)return [];

 // Events: sources array
 if(Array.isArray(item.sources)){

  return item.sources.map((source,index)=>{

   if(typeof source==="string"){
    return {
     name:"Source "+(index+1),
     stream_url:source
    };
   }

   return {
    ...source,
    name:source.name ||
         source.language ||
         source.label ||
         "Source "+(index+1),
    stream_url:getStreamURL(source)
   };

  }).filter(source=>source.stream_url);

 }

 // Channels: direct stream_url
 const url=getStreamURL(item);

 if(url){

  return [{
   ...item,
   name:item.name || "Default Source",
   stream_url:url
  }];

 }

 return [];
}

// ===================================
// 5. DISPLAY EVENTS AND CHANNELS
// ===================================

function createCard(item,type){

 const card=document.createElement("div");
 card.className="item";

 const logo=item.logo || item.poster || "";

 if(logo){

  const img=document.createElement("img");
  img.src=logo;
  img.alt="";
  img.loading="lazy";
  img.onerror=()=>img.remove();
  card.appendChild(img);

 }

 const title=document.createElement("strong");
 title.textContent=item.name || item.title || "Live Channel";

 const info=document.createElement("small");

 info.textContent=
  type+" • "+getSources(item).length+" Sources";

 card.append(title,info);

 card.onclick=()=>showSources(item,card);

 return card;
}

function renderDatabase(){

 const events=document.getElementById("events");
 const channels=document.getElementById("channels");

 events.innerHTML="";
 channels.innerHTML="";

 eventsData.forEach(item=>{
  events.appendChild(createCard(item,"CRICKET"));
 });

 channelsData.forEach(item=>{
  channels.appendChild(createCard(item,"TV CHANNEL"));
 });

 if(!eventsData.length){
  events.innerHTML='<div class="empty">No events found</div>';
 }

 if(!channelsData.length){
  channels.innerHTML='<div class="empty">No channels found</div>';
 }
}

// ===================================
// 6. SELECT SOURCE / LANGUAGE
// ===================================

function showSources(item,card){

 document.querySelectorAll(".item").forEach(el=>{
  el.classList.remove("active");
 });

 card.classList.add("active");

 selectedSources=getSources(item);

 sourceSelect.innerHTML="";

 selectedSources.forEach((source,index)=>{

  const option=document.createElement("option");

  option.value=index;
  option.textContent=source.name;

  sourceSelect.appendChild(option);

 });

 if(selectedSources.length){

  currentIndex=0;
  playStreamAt(0);

 }else{

  status("No stream URL available for this event.");

 }

}

// ===================================
// 7. DETECT VIDEO FORMAT
// ===================================

function detectType(source){

 const url=source.stream_url.toLowerCase().split("?")[0];

 const type=(
  source.sourcetype ||
  source.type ||
  ""
 ).toLowerCase();

 if(type.includes("m3u8") || url.endsWith(".m3u8")){
  return "hls";
 }

 if(type.includes("mpd") || url.endsWith(".mpd")){
  return "dash";
 }

 if(type.includes("mp4") || url.endsWith(".mp4")){
  return "mp4";
 }

 return "unknown";
}

// ===================================
// 8. CLEAN OLD PLAYER
// ===================================

function destroyPlayer(){

 if(hls){
  hls.destroy();
  hls=null;
 }

 if(dash){
  dash.reset();
  dash=null;
 }

 video.pause();
 video.removeAttribute("src");
 video.load();

}

// ===================================
// 9. AUTOMATIC NEXT SOURCE
// ===================================

function nextSource(message){

 status(message);

 const next=currentIndex+1;

 if(next<selectedSources.length){

  setTimeout(()=>{
   playStreamAt(next);
  },700);

 }else{

  status(
   "No playable source found. "+
   "Check stream expiry, CORS or DRM licence."
  );

 }

}

// ===================================
// 10. UNIVERSAL PLAYER
// ===================================

function playStreamAt(index){

 if(index>=selectedSources.length){
  status("No more sources available.");
  return;
 }

 currentIndex=index;

 sourceSelect.value=index;

 const source=selectedSources[index];
 const url=source.stream_url;
 const type=detectType(source);

 const attempt=++playerAttempt;

 destroyPlayer();

 status(
  "Loading "+source.name+
  " • "+type.toUpperCase()
 );

 // HLS
 if(type==="hls"){

  if(Hls.isSupported()){

   hls=new Hls({
    enableWorker:true,
    lowLatencyMode:false,
    backBufferLength:30
   });

   hls.loadSource(url);
   hls.attachMedia(video);

   hls.on(Hls.Events.MANIFEST_PARSED,()=>{

    if(attempt!==playerAttempt)return;

    status("HLS ready • Press PLAY");
    video.play().catch(()=>{});

   });

   hls.on(Hls.Events.ERROR,(event,data)=>{

    if(attempt!==playerAttempt)return;

    if(data.fatal){

     nextSource("HLS failed: "+data.details);

    }

   });

  }else if(video.canPlayType("application/vnd.apple.mpegurl")){

   video.src=url;
   status("Native HLS ready");

  }else{

   nextSource("HLS not supported");

  }

 }

 // DASH
 else if(type==="dash"){

  if(!window.dashjs){

   nextSource("DASH library unavailable");
   return;

  }

  dash=dashjs.MediaPlayer().create();

  dash.on(
   dashjs.MediaPlayer.events.STREAM_INITIALIZED,
   ()=>{

    if(attempt!==playerAttempt)return;

    status("DASH ready • Press PLAY");
    video.play().catch(()=>{});

   }
  );

  dash.on(
   dashjs.MediaPlayer.events.ERROR,
   (event)=>{

    if(attempt!==playerAttempt)return;

    console.error("DASH error:",event);

    nextSource(
     "DASH playback failed. Check manifest, CORS and DRM licence."
    );

   }
  );

  dash.initialize(video,url,false);

 }

 // MP4
 else if(type==="mp4"){

  video.src=url;

  status("MP4 ready");

  video.play().catch(()=>{});

 }

 else{

  nextSource("Unsupported video format");

 }

}

function playSelected(){

 if(!selectedSources.length){
  status("First select an event or channel.");
  return;
 }

 playStreamAt(Number(sourceSelect.value || 0));

}

document.getElementById("playButton")
.addEventListener("click",playSelected);

// ===================================
// 11. SPEED CONTROL
// ===================================

document.getElementById("speed")
.addEventListener("change",function(){

 video.playbackRate=Number(this.value);

});

// ===================================
// 12. SEARCH
// ===================================

document.getElementById("search")
.addEventListener("input",function(){

 const q=this.value.toLowerCase();

 document.querySelectorAll(".item").forEach(card=>{

  card.style.display=
   card.textContent.toLowerCase().includes(q)
   ? "":"none";

 });

});

// ===================================
// 13. START
// ===================================

loadDatabase();

</script>
</body>
</html>
