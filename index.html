<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKS Web Player</title>
    
    <style>
        /* Yeh thoda design hai taaki iframe poori screen cover kare */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Extra scrollbars ko hide karne ke liye */
            background-color: #000; /* Player ke background ko black rakhne ke liye */
        }
        
        .my-iframe {
            width: 100%;
            height: 100vh; /* Viewport ki 100% height lega */
            border: none; /* Border hatane ke liye */
        }
    </style>
</head>
<body>

    <!-- Aapka player yahan embed ho raha hai with permissions -->
    <iframe class="my-iframe" src="https://tv4wav.pages.dev/?app=jiohd&id=1998" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" frameborder="0"></iframe>

</body>
</html>
