
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKS sports Live</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d18;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:18px;background:#111b2d;
 display:flex;justify-content:space-between;
 align-items:center;border-bottom:1px solid #26334b;
}
.logo{font-size:22px;font-weight:bold;color:#ffca28}
.container{padding:15px;max-width:1100px;margin:auto}
.search{
 width:100%;padding:14px;border-radius:9px;
 border:1px solid #34435b;background:#121c2d;
 color:white;margin-bottom:15px;
}
.playerbox{
 background:#000;border-radius:12px;overflow:hidden;
 position:relative;
}
video{width:100%;aspect-ratio:16/9;display:block}
.status{padding:12px;color:#aaa;font-size:13px}
select,button{
 padding:12px;border-radius:8px;
 background:#17243a;color:white;
 border:1px solid #34435b;
}
.controls{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.controls select{flex:1;min-width:130px}
.section-title{font-size:18px;margin:22px 0 12px}
.grid{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
 gap:12px;
}
.item{
 background:#142037;border:1px solid #263651;
 border-radius:10px;padding:14px;cursor:pointer;
 min-height:85px;
}
.item:hover{border-color:#ffca28}
.item strong{display:block;margin-bottom:8px}
.item small{color:#9baac2}
.active{border:1px solid #ffca28}
footer{text-align:center;color:#718099;padding:25px}
</style>
</head>

<body>

<header>
 <div class="logo">MKS SPORTS</div>
 <div>LIVE PLAYER</div>
</header>

<div class="container">

<input id="search" class="search"
placeholder="Search match or channel...">

<div class="playerbox">
 <video id="video" controls playsinline></video>
</div>

<div class="status" id="status">Loading sports data...</div>

<div class="controls">
 <select id="sourceSelect">
  <option value="">Select Stream</option>
 </select>

 <select id="speed">
  <option value="1">Speed 1x</option>
  <option value="1.25">Speed 1.25x</option>
  <option value="1.5">Speed 1.5x</option>
  <option value="2">Speed 2x</option>
 </select>

 <button onclick="playSelected()">PLAY</button>
</div>

<h3 class="section-title">LIVE EVENTS</h3>
<div id="events" class="grid"></div>

<h3 class="section-title">TV CHANNELS</h3>
<div id="channels" class="grid"></div>

</div>

<footer>MKS SPORTS • Universal Video Player</footer>

<script>
const JSON_URLS = [
 "https://rjson.snackonline223.workers.dev/events.json",
 "https://sonujson-v5.pages.dev/Data/sports.json",
 "https://sonujson-v7.pages.dev/Data/sports.json"
];

const video = document.getElementById("video");
const statusBox = document.getElementById("status");
const sourceSelect = document.getElementById("sourceSelect");

let allEvents = [];
let allChannels = [];
let currentHls = null;
let currentDash = null;
let selectedSources = [];

function status(message){
 statusBox.textContent = message;
}

// Fetch primary JSON, then backups
async function loadData(){

 for(const url of JSON_URLS){
  try{
   status("Connecting to sports server...");

   const response = await fetch(url,{
    cache:"no-store"
   });

   if(!response.ok) throw new Error("HTTP "+response.status);

   const data = await response.json();

   if(Array.isArray(data.events)){
    allEvents = data.events;
   }

   if(Array.isArray(data.channels)){
    allChannels = data.channels;
   }

   if(!allEvents.length && !allChannels.length){
    throw new Error("Invalid JSON structure");
   }

   status("Sports data loaded successfully");
   render();
   return;

  }catch(error){
   console.warn(url,error);
  }
 }

 status("All JSON servers failed. Please try again.");
}

// Normalize stream sources
function getSources(item){

 if(Array.isArray(item.sources)){
  return item.sources;
 }

 if(item.stream_url){
  return [item];
 }

 return [];
}

function getType(source){

 const url = (source.stream_url || "").toLowerCase();
 const type = (source.sourcetype || "").toLowerCase();

 if(type.includes("m3u8") || url.includes(".m3u8")){
  return "hls";
 }

 if(type.includes("mpd") || url.includes(".mpd")){
  return "dash";
 }

 if(url.includes(".mp4")){
  return "mp4";
 }

 return "unknown";
}

function render(){

 const eventsBox = document.getElementById("events");
 const channelsBox = document.getElementById("channels");

 eventsBox.innerHTML = "";
 channelsBox.innerHTML = "";

 allEvents.forEach((event,index)=>{

  const div = document.createElement("div");
  div.className="item";

  const title=document.createElement("strong");
  title.textContent=event.name || "Live Event";

  const info=document.createElement("small");
  info.textContent=
   (event.type || "SPORTS")+" • "+
   getSources(event).length+" Sources";

  div.append(title,info);

  div.onclick=()=>showSources(event);

  eventsBox.appendChild(div);
 });

 allChannels.forEach(channel=>{

  const div=document.createElement("div");
  div.className="item";

  const title=document.createElement("strong");
  title.textContent=channel.name || "TV Channel";

  const info=document.createElement("small");
  info.textContent="TV CHANNEL";

  div.append(title,info);

  div.onclick=()=>showSources(channel);

  channelsBox.appendChild(div);
 });
}

// Select event/channel sources
function showSources(item){

 selectedSources=getSources(item);

 sourceSelect.innerHTML="";

 selectedSources.forEach((source,index)=>{

  const option=document.createElement("option");

  option.value=index;

  option.textContent=
   source.name || ("Source "+(index+1));

  sourceSelect.appendChild(option);
 });

 if(selectedSources.length){
  playSelected();
 }else{
  status("No streams available");
 }
}

// Player
function playSelected(){

 const index=Number(sourceSelect.value || 0);
 const source=selectedSources[index];

 if(!source){
  status("Please select a source");
  return;
 }

 playStream(source.stream_url);
}

function destroyPlayers(){

 if(currentHls){
  currentHls.destroy();
  currentHls=null;
 }

 if(currentDash){
  currentDash.reset();
  currentDash=null;
 }

 video.pause();
 video.removeAttribute("src");
 video.load();
}

function playStream(url){

 if(!url){
  status("Invalid stream URL");
  return;
 }

 destroyPlayers();

 const type=getType({stream_url:url});

 status("Connecting to stream...");

 if(type==="hls"){

  if(Hls.isSupported()){

   currentHls=new Hls();

   currentHls.loadSource(url);
   currentHls.attachMedia(video);

   currentHls.on(Hls.Events.MANIFEST_PARSED,()=>{
    status("HLS stream ready");
    video.play().catch(()=>{});
   });

   currentHls.on(Hls.Events.ERROR,(event,data)=>{
    if(data.fatal){
     status("HLS playback failed: "+data.type);
    }
   });

  }else if(video.canPlayType("application/vnd.apple.mpegurl")){

   video.src=url;
   video.play().catch(()=>{});
   status("Native HLS playback");

  }else{
   status("HLS not supported on this browser");
  }

 }

 else if(type==="dash"){

  currentDash=dashjs.MediaPlayer().create();

  currentDash.initialize(video,url,true);

  currentDash.on(
   dashjs.MediaPlayer.events.STREAM_INITIALIZED,
   ()=>{
    status("DASH stream ready");
   }
  );

  currentDash.on(
   dashjs.MediaPlayer.events.ERROR,
   ()=>{
    status("DASH playback failed. Check stream access and DRM.");
   }
  );

 }

 else if(type==="mp4"){

  video.src=url;
  video.play().catch(()=>{});
  status("MP4 playback");

 }

 else{
  status("Unsupported or unknown stream format");
 }
}

// Playback speed
document.getElementById("speed").onchange=function(){
 video.playbackRate=Number(this.value);
};

// Search
document.getElementById("search").addEventListener("input",function(){

 const query=this.value.toLowerCase();

 document.querySelectorAll(".item").forEach(item=>{
  item.style.display=
   item.textContent.toLowerCase().includes(query)
   ? "" : "none";
 });
});

// Start
loadData();

</script>
</body>
</html>
