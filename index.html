
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKS Sports Live</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>
<script src="https://cdn.dashjs.org/v4.7.4/dash.all.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial,sans-serif}
header{padding:18px 20px;background:#111b2d;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #293750}
.logo{font-size:24px;font-weight:bold;color:#ffca28}
.container{padding:18px;max-width:1100px;margin:auto}
input,select,button{font-size:16px;border-radius:10px;padding:14px;background:#17243a;color:white;border:1px solid #34445f}
input{width:100%;margin-bottom:18px}
.player{background:#000;border-radius:14px;overflow:hidden}
video{width:100%;aspect-ratio:16/9;display:block}
#status{padding:14px;color:#adb9cc;font-size:14px;min-height:45px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 25px}
.controls select{flex:1;min-width:130px}
button{cursor:pointer}
button:active,.item:active{opacity:.7}
h3{margin:25px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.item{padding:16px;background:#142037;border:1px solid #293b58;border-radius:12px;cursor:pointer;min-height:95px}
.item strong{display:block;font-size:17px;margin-bottom:9px}
.item small{color:#9eacc4}
.item:hover{border-color:#ffca28}
footer{text-align:center;padding:25px;color:#8492aa}
</style>
</head>

<body>

<header>
 <div class="logo">MKS SPORTS</div>
 <div>LIVE PLAYER</div>
</header>

<div class="container">

<input id="search" placeholder="Search match or channel...">

<div class="player">
 <video id="video" controls playsinline></video>
</div>

<div id="status">Loading sports data...</div>

<div class="controls">
 <select id="sourceSelect">
  <option value="">Select Source</option>
 </select>

 <select id="speed">
  <option value="1">Speed 1x</option>
  <option value="1.25">Speed 1.25x</option>
  <option value="1.5">Speed 1.5x</option>
  <option value="2">Speed 2x</option>
 </select>

 <button onclick="playSelected()">PLAY</button>
</div>

<h3>LIVE EVENTS</h3>
<div id="events" class="grid"></div>

<h3>TV CHANNELS</h3>
<div id="channels" class="grid"></div>

</div>

<footer>MKS SPORTS • LIVE STREAMING</footer>

<script>
const JSON_URLS=[
 "https://rjson.snackonline223.workers.dev/events.json",
 "https://sonujson-v5.pages.dev/Data/sports.json",
 "https://sonujson-v7.pages.dev/Data/sports.json"
];

const video=document.getElementById("video");
const statusBox=document.getElementById("status");
const sourceSelect=document.getElementById("sourceSelect");

let eventsData=[];
let channelsData=[];
let selectedSources=[];
let hls=null;
let dash=null;
let currentIndex=0;
let fallbackUsed=false;

function status(msg){
 statusBox.textContent=msg;
}

// Find stream URL from different JSON formats
function getURL(obj){
 if(!obj || typeof obj!=="object")return "";
 return obj.stream_url || obj.url || obj.file ||
        obj.src || obj.link || obj.play_url || "";
}

function normalizeSources(item){
 if(!item)return [];

 let list=Array.isArray(item.sources)
  ?item.sources:
  (getURL(item)?[item]:[]);

 return list.map((s,i)=>{
  if(typeof s==="string"){
   return {name:"Source "+(i+1),stream_url:s};
  }

  return {
   ...s,
   name:s.name || s.language || s.label || "Source "+(i+1),
   stream_url:getURL(s)
  };
 }).filter(s=>s.stream_url);
}

// Load JSON with backup
async function loadData(){

 for(const url of JSON_URLS){
  try{
   status("Connecting: "+url);

   const response=await fetch(url,{
    cache:"no-store"
   });

   if(!response.ok)throw Error("HTTP "+response.status);

   const data=await response.json();

   const ev=Array.isArray(data.events)?data.events:[];
   const ch=Array.isArray(data.channels)?data.channels:[];

   if(!ev.length&&!ch.length)throw Error("No events found");

   eventsData=ev;
   channelsData=ch;

   status("Sports data loaded successfully");
   render();
   return;

  }catch(e){
   console.error(e);
  }
 }

 status("Unable to load JSON. Check server or CORS settings.");
}

function makeCard(item,type,index){

 const card=document.createElement("div");
 card.className="item";

 const title=document.createElement("strong");
 title.textContent=item.name || item.title || "Live Channel";

 const info=document.createElement("small");
 info.textContent=
  (item.type || type)+" • "+
  normalizeSources(item).length+" Sources";

 card.append(title,info);

 card.onclick=()=>showSources(item);

 return card;
}

function render(){

 const evBox=document.getElementById("events");
 const chBox=document.getElementById("channels");

 evBox.innerHTML="";
 chBox.innerHTML="";

 eventsData.forEach((e,i)=>{
  evBox.appendChild(makeCard(e,"LIVE",i));
 });

 channelsData.forEach((c,i)=>{
  chBox.appendChild(makeCard(c,"TV",i));
 });
}

function showSources(item){

 selectedSources=normalizeSources(item);
 sourceSelect.innerHTML="";

 selectedSources.forEach((s,i)=>{
  const option=document.createElement("option");
  option.value=i;
  option.textContent=s.name;
  sourceSelect.appendChild(option);
 });

 if(selectedSources.length){
  currentIndex=0;
  playSelected();
 }else{
  status("No valid stream URL found");
 }
}

function destroyPlayer(){

 if(hls){
  hls.destroy();
  hls=null;
 }

 if(dash){
  dash.reset();
  dash=null;
 }

 video.pause();
 video.removeAttribute("src");
 video.load();
}

function detectType(url,source){

 const type=(source.sourcetype || source.type || "").toLowerCase();
 const u=url.toLowerCase().split("?")[0];

 if(type.includes("mpd") || u.endsWith(".mpd"))return "dash";
 if(type.includes("m3u8") || u.endsWith(".m3u8"))return "hls";
 if(type.includes("mp4") || u.endsWith(".mp4"))return "mp4";

 return "unknown";
}

function playSelected(){

 const index=Number(sourceSelect.value || 0);
 playIndex(index);
}

function playIndex(index){

 if(index<0 || index>=selectedSources.length){
  status("All available sources failed.");
  return;
 }

 currentIndex=index;
 sourceSelect.value=index;
 fallbackUsed=false;

 const source=selectedSources[index];
 const url=source.stream_url;
 const type=detectType(url,source);

 destroyPlayer();

 status("Loading "+source.name+" ("+type+")...");

 if(type==="hls"){

  if(Hls.isSupported()){

   hls=new Hls({
    enableWorker:true,
    lowLatencyMode:false,
    backBufferLength:30
   });

   hls.loadSource(url);
   hls.attachMedia(video);

   hls.on(Hls.Events.MANIFEST_PARSED,()=>{
    status("HLS connected. Starting playback...");
    video.play().catch(()=>status("Press PLAY to start video."));
   });

   hls.on(Hls.Events.ERROR,(event,data)=>{
    if(data.fatal){
     status("HLS error: "+data.details);
     tryNext();
    }
   });

  }else if(video.canPlayType("application/vnd.apple.mpegurl")){

   video.src=url;
   video.play().catch(()=>{});
   status("Native HLS playback");

  }else{
   status("HLS is not supported by this browser");
   tryNext();
  }

 }

 else if(type==="dash"){

  if(!window.dashjs){
   status("DASH player library unavailable");
   tryNext();
   return;
  }

  dash=dashjs.MediaPlayer().create();

  dash.initialize(video,url,false);

  dash.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED,()=>{
   status("DASH connected. Starting playback...");
   video.play().catch(()=>status("Press PLAY to start video."));
  });

  dash.on(dashjs.MediaPlayer.events.ERROR,()=>{
   if(!fallbackUsed){
    status("DASH error. Trying next source...");
    tryNext();
   }
  });

 }

 else if(type==="mp4"){

  video.src=url;
  video.play().catch(()=>{});
  status("MP4 stream loaded");

 }else{

  status("Unknown stream format. Trying next source...");
  tryNext();
 }
}

function tryNext(){

 if(fallbackUsed)return;
 fallbackUsed=true;

 setTimeout(()=>{
  playIndex(currentIndex+1);
 },500);
}

// Playback controls
document.getElementById("speed").onchange=function(){
 video.playbackRate=Number(this.value);
};

// Search events and channels
document.getElementById("search").addEventListener("input",function(){

 const q=this.value.toLowerCase();

 document.querySelectorAll(".item").forEach(card=>{
  card.style.display=
   card.textContent.toLowerCase().includes(q)?"":"none";
 });
});

video.addEventListener("error",()=>{
 if(!fallbackUsed){
  status("Video error. Trying another source...");
  tryNext();
 }
});

loadData();

</script>
</body>
</html>
