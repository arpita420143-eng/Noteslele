<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKS Sports - Premium (All-in-One)</title>
    
    <!-- Video Player Scripts (Shaka Player) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.min.js"></script>

    <style>
        /* === CSS DESIGN === */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: #fff; margin: 0; padding: 15px; }
        .hidden { display: none !important; }
        
        /* Video Player Area */
        #videoBox { width: 100%; height: 280px; background: #000; margin: 15px 0; border-radius: 8px; border: 2px solid #ff9800; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
        #nowPlayingText { color: #ff9800; font-size: 18px; text-align: center; margin-bottom: 5px; font-weight: bold; }
        .ad-warning { position: absolute; top: 0; left: 0; width: 100%; background: rgba(255, 0, 0, 0.9); color: white; text-align: center; font-size: 12px; padding: 4px; z-index: 10; font-weight: bold; }
        
        /* Categories & Accordion */
        h3 { cursor: pointer; background: #1f1f1f; padding: 12px 15px; border-radius: 6px; margin-top: 15px; display: flex; justify-content: space-between; border-left: 4px solid #ff9800; }
        .category-list { display: none; padding: 10px 0; }
        .category-list.active { display: block; }
        
        /* Channel Cards */
        .channel-card { border: 1px solid #333; border-radius: 8px; padding: 10px; margin: 5px; cursor: pointer; display: inline-block; text-align: center; background: #1a1a1a; width: 130px; transition: 0.3s; vertical-align: top; }
        .channel-card:hover { border-color: #ff9800; background: #2a2a2a; }
        .channel-logo-container { position: relative; height: 65px; display: flex; justify-content: center; align-items: center; }
        .channel-logo { max-width: 100%; max-height: 100%; object-fit: contain; }
        .channel-title { font-size: 12px; margin-top: 8px; color: #ddd; font-weight: bold; }
        
        /* Splash Screen */
        #splash-screen { position: fixed; top:0; left:0; width: 100%; height: 100%; background: #0a0a0a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; transition: opacity 0.5s; }
        #fingerprint-prompt { font-size: 20px; cursor: pointer; padding: 20px; background: #1f1f1f; border-radius: 50%; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; border: 2px solid #ff9800; text-align: center; }
        #password-box { text-align: center; }
        #passInput { padding: 10px; font-size: 16px; border: 1px solid #444; background: #222; color: #fff; border-radius: 5px; margin-bottom: 10px; text-align: center; outline: none; }
        #authBtn { padding: 10px 20px; background: #ff9800; color: #000; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body class="locked">

    <!-- === SPLASH SCREEN & PIN CHECK === -->
    <div id="splash-screen">
        <div id="fingerprint-prompt" onclick="showPasswordBox()">👆<br>Tap</div>
        <div id="password-box" class="hidden">
            <input type="password" id="passInput" placeholder="Enter PIN">
            <br>
            <button id="authBtn" onclick="checkPassword()">ENTER</button>
            <div id="errorMsg" class="hidden" style="color:#ff4444; margin-top: 10px;">Wrong PIN! Try Again.</div>
        </div>
    </div>

    <!-- === VIDEO PLAYER AREA === -->
    <div id="nowPlayingText">Select a Channel to Play</div>
    <div id="loading-spinner" class="hidden" style="text-align:center; color:#ff9800; margin-bottom:10px;">Loading Player...</div>
    <div id="videoBox">
        <div style="color:#555;">Player will load here</div>
    </div>

    <!-- === CHANNEL LISTS === -->
    <!-- 💎 MKS Premium & Backup (Merged) -->
    <h3 onclick="toggleCategory('mksExclusiveList', 'iconPrem')">💎 MKS Premium & Backup <span id="iconPrem">▼</span></h3>
    <div id="mksExclusiveList" class="category-list active"></div>

    <!-- 📺 Sony Channels -->
    <h3 onclick="toggleCategory('mksTvList', 'iconSony')">📺 Sony Channels <span id="iconSony">▼</span></h3>
    <div id="mksTvList" class="category-list"></div>

    <!-- ⭐ Star Channels -->
    <h3 onclick="toggleCategory('mksStarList', 'iconStar')">⭐ Star Channels <span id="iconStar">▼</span></h3>
    <div id="mksStarList" class="category-list"></div>

    <!-- 🏏 Live Matches (Fancode) -->
    <h3 onclick="toggleCategory('fancodeList', 'iconFan')">🏏 Live Matches (Fancode) <span id="iconFan">▼</span></h3>
    <div id="fancodeList" class="category-list"></div>

    <!-- === JAVASCRIPT === -->
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());

        // --- 1. PIN CONFIGURATION ---
        const SECRET_PIN = "8888"; 
        
        window.showPasswordBox = function() { 
            document.getElementById("fingerprint-prompt").style.display = "none"; 
            document.getElementById("password-box").style.display = "block"; 
        };

        window.checkPassword = function() {
            const input = document.getElementById("passInput").value;
            if (input === SECRET_PIN) { 
                document.getElementById("splash-screen").style.opacity = "0"; 
                setTimeout(() => { 
                    document.getElementById("splash-screen").style.display = "none"; 
                    document.body.classList.remove("locked"); 
                }, 500); 
            } else { 
                document.getElementById("errorMsg").style.display = "block"; 
                document.getElementById("passInput").value = ""; 
            }
        };

        // --- 2. UI TOGGLE FUNCTION ---
        window.toggleCategory = function(listId, iconId) {
            const list = document.getElementById(listId);
            const icon = document.getElementById(iconId);
            if (!list) return;
            if (list.classList.contains('active')) {
                list.classList.remove('active');
                icon.innerText = "▼";
            } else {
                list.classList.add('active');
                icon.innerText = "▲";
            }
        };

        // --- 3. CHANNEL DATA ---
        const topExclusiveChannels = [
            { title: "Willow TV", logo: "https://via.placeholder.com/120x60/000/FFF?text=WILLOW+TV", url: "https://amg01269-amg01269c1-sportstribal-emea-5204.playouts.now.amagi.tv/ts-eu-w1-n2/playlist/amg01269-willowtvfast-willowplus-sportstribalemea/playlist.m3u8", sourceType: "custom" },
            { title: "Ten Cricket HD", logo: "https://via.placeholder.com/120x60/000/FFF?text=TEN+CRICKET", url: "https://stream.ottplus.live/live/ten_cricket_hd_abr/live/ten_cricket_hd_720/chunks.m3u8", sourceType: "custom" },
            { title: "Zee Sarthak", logo: "https://via.placeholder.com/120x60/000/FFF?text=ZEE+SARTHAK", url: "https://d1g8wgjurz8via.cloudfront.net/bpk-tv/Zeesarthak/default/devil.mpd", keyId: "ecad0b097b574078a4a1bde24bfdb2e5", key: "568bb13d04db4b738864f6c849474cd5", sourceType: "custom" },
            { title: "Zee TV", logo: "https://via.placeholder.com/120x60/000/FFF?text=ZEE+TV", url: "https://d1g8wgjurz8via.cloudfront.net/bpk-tv/Zeetv/default/manifest.mpd", keyId: "ed068cf84f0640ccbc7c0e395c0a272e", key: "bb722190f2bb446391020411a7d0828b", sourceType: "custom" }
        ];

        const backupChannels = [
            { title: "Star Sports 1 HD", logo: "https://via.placeholder.com/120x60/000/FFF?text=STAR+SPORTS+1", url: "https://tv4wav.pages.dev/?app=cricketm3u8&id=110", sourceType: "tv4wap_direct" },
            { title: "Star Sports 1 Hindi", logo: "https://via.placeholder.com/120x60/000/FFF?text=STAR+1+HINDI", url: "https://tv4wav.pages.dev/?app=crichd&id=starhindi", sourceType: "tv4wap_direct" },
            { title: "Star Sports 2 HD", logo: "https://via.placeholder.com/120x60/000/FFF?text=STAR+SPORTS+2", url: "https://tv4wav.pages.dev/?app=cricketm3u8&id=109", sourceType: "tv4wap_direct" },
            { title: "Sony Ten 1", logo: "https://via.placeholder.com/120x60/000/FFF?text=SONY+TEN+1", url: "https://tv4wav.pages.dev/?app=jiohd&id=33722", sourceType: "tv4wap_direct" }
        ];

        // --- 4. FETCH JSON DATA (SONY, STAR, FANCODE) ---
        const proxyBase = "https://mkscricket.mks-cricket.workers.dev/"; 
        const sonyJsonUrl = atob('aHR0cHM6Ly9hbGxpbm9uZXJlYm9ybjIub25saW5lL3Nvbnkvc2xpdjMuanNvbg==');
        const starJsonUrl = atob('aHR0cHM6Ly9qdHZ4d2ViLnBhZ2VzLmRldi9qc3RyNHdlYi5qc29u');
        const fancodeJsonUrl = atob('aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL2RvY3Rvci04dHJhbmdlL3p5cGh4OC9yZWZzL2hlYWRzL21haW4vZGF0YS9mYW5jb2RlLmpzb24=');

        Promise.all([
            fetch(proxyBase + "?url=" + encodeURIComponent(sonyJsonUrl)).then(res => res.json()).catch(() => ({})),
            fetch(proxyBase + "?url=" + encodeURIComponent(starJsonUrl)).then(res => res.json()).catch(() => ({})),
            fetch(fancodeJsonUrl).then(res => res.json()).catch(() => ({}))
        ]).then(([sonyData, starData, fancodeData]) => {
            
            const appendChannel = (listId, channelData) => {
                const list = document.getElementById(listId);
                if (list) list.appendChild(createChannelCard(channelData));
            };

            // Load Exclusives and Backups together
            topExclusiveChannels.forEach(ch => appendChannel('mksExclusiveList', ch));
            backupChannels.forEach(ch => appendChannel('mksExclusiveList', ch));

            // Load Fancode Live Matches
            if (fancodeData && fancodeData.matches) {
                fancodeData.matches.forEach(match => {
                    const isLive = (match.streamingStatus || "").toUpperCase() === "STARTED";
                    if (isLive && match.auto_streams && match.auto_streams.length > 0) {
                        let streamUrl = match.auto_streams[0].url || match.url || match.stream_url || "";
                        appendChannel('fancodeList', { title: match.title, logo: match.image || "https://via.placeholder.com/120x60?text=FANCODE", url: streamUrl, sourceType: 'fancode' });
                    }
                });
            }

            // Load Sony & Star
            for (const key in sonyData) { 
                let ch = sonyData[key]; if (ch.title || ch.name) { ch.sourceType = 'sony'; appendChannel('mksTvList', ch); }
            }
            for (const key in starData) { 
                let ch = starData[key]; if (ch.title || ch.name) { ch.sourceType = 'star'; appendChannel('mksStarList', ch); }
            }
        });

        // --- 5. PLAYER LOGIC (DIRECT & IFRAME) ---
        let shakaPlayerInstance = null; // Global player tracker

        function createChannelCard(channel) {
            const chTitle = channel.title || channel.name || "MKS SPORTS";
            const chLogo = channel.logo || channel.icon || "https://via.placeholder.com/120x60/000/FFF?text=MKS+SPORTS";
            const chId = channel.id || channel.channel_id || "";
            const chUrl = channel.m3u8 || channel.url || channel.link || "";

            const card = document.createElement('div');
            card.className = 'channel-card';
            card.innerHTML = `
                <div class="channel-logo-container">
                    <img src="${chLogo}" class="channel-logo" onerror="this.src='https://via.placeholder.com/120x60/000/FFF?text=MKS'">
                </div>
                <div class="channel-title">${chTitle}</div>
            `;

            card.onclick = () => {
                document.getElementById('nowPlayingText').innerText = chTitle;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
                const vBox = document.getElementById('videoBox');
                document.getElementById('loading-spinner').classList.remove('hidden');
                
                // Destroy old shaka player if exists
                if (shakaPlayerInstance) {
                    shakaPlayerInstance.destroy();
                    shakaPlayerInstance = null;
                }

                setTimeout(() => {
                    document.getElementById('loading-spinner').classList.add('hidden');
                    let baseAttributes = `style="border:none; width:100%; height:100%; display:block;" allow="autoplay; encrypted-media; fullscreen" allowfullscreen="true"`;

                    if (channel.sourceType === 'tv4wap_direct') {
                        vBox.innerHTML = `<div class="ad-warning">📺 MKS BACKUP PLAYER ACTIVE</div><iframe src="${chUrl}" ${baseAttributes}></iframe>`;
                    } 
                    else if (channel.sourceType === 'sony') {
                        vBox.innerHTML = `<div class="ad-warning">📺 MKS TV PLAYER</div><iframe src="https://allinonereborn2.online/sony/ptest1.html?id=${channel.id}" ${baseAttributes}></iframe>`;
                    } 
                    else if (channel.sourceType === 'star') {
                        let fUrl = chUrl.includes('pind') ? chUrl : (`https://jtvxweb.pages.dev/pind?id=${chId}`);
                        vBox.innerHTML = `<div class="ad-warning">⚠️ TAP FAST 2-3 TIMES ON PLAY BUTTON TO BYPASS ADS</div><iframe src="${fUrl}" ${baseAttributes}></iframe>`;
                    } 
                    else if (channel.sourceType === 'fancode' || channel.sourceType === 'custom') {
                        // NATIVE SHAKA PLAYER INTEGRATION (No Iframe needed)
                        vBox.innerHTML = `
                            <div class="ad-warning">🔴 MKS SPORTS LIVE (No Ads)</div>
                            <video id="nativePlayer" controls autoplay style="width:100%; height:100%; outline:none; background:#000;"></video>
                        `;
                        startNativePlayer(chUrl, channel.keyId, channel.key);
                    }
                }, 500);
            };
            return card;
        }

        // --- 6. NATIVE DRM PLAYER ENGINE ---
        async function startNativePlayer(url, keyId, key) {
            shaka.polyfill.installAll();
            const video = document.getElementById('nativePlayer');
            shakaPlayerInstance = new shaka.Player(video);

            if (keyId && key) {
                const clearKeyConfig = {};
                clearKeyConfig[keyId] = key;
                shakaPlayerInstance.configure({
                    drm: { clearKeys: clearKeyConfig }
                });
            }

            try {
                await shakaPlayerInstance.load(url);
                console.log('Stream Loaded Successfully!');
            } catch (e) {
                console.error('Player Error:', e);
                document.getElementById('videoBox').innerHTML = `<div style="color:red; text-align:center; padding-top:40px;">Error playing this stream. <br>Try another backup channel.</div>`;
            }
        }
    </script>
</body>
</html>
