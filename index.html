<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKS Sports - Premium</title>
    
    <!-- Video Player Engines -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        /* === CSS DESIGN === */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: #fff; margin: 0; padding: 15px; }
        .hidden { display: none !important; }
        
        /* Video Player */
        #videoBox { width: 100%; height: 260px; background: #000; margin: 15px 0; border-radius: 8px; border: 2px solid #ff9800; overflow: hidden; position: relative; }
        #nowPlayingText { color: #ff9800; font-size: 18px; text-align: center; margin-bottom: 5px; font-weight: bold; }
        .ad-warning { position: absolute; top: 0; left: 0; width: 100%; background: rgba(255, 0, 0, 0.9); color: white; text-align: center; font-size: 12px; padding: 4px; z-index: 10; font-weight: bold; }
        
        /* Accordion */
        h3 { cursor: pointer; background: #1f1f1f; padding: 12px 15px; border-radius: 6px; margin-top: 15px; display: flex; justify-content: space-between; border-left: 4px solid #ff9800; }
        .category-list { display: none; padding: 10px 0; }
        .category-list.active { display: block; }
        
        /* Channel Cards */
        .channel-card { border: 1px solid #333; border-radius: 8px; padding: 10px; margin: 5px; cursor: pointer; display: inline-block; text-align: center; background: #1a1a1a; width: 130px; height: 110px; transition: 0.3s; vertical-align: top; }
        .channel-card:hover { border-color: #ff9800; background: #2a2a2a; }
        
        /* Image Fallback System */
        .channel-logo-container { position: relative; height: 60px; display: flex; justify-content: center; align-items: center; background: #222; border-radius: 4px; overflow: hidden; }
        .channel-logo { max-width: 100%; max-height: 100%; object-fit: contain; }
        .channel-title { font-size: 12px; margin-top: 8px; color: #ddd; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* Splash Screen */
        #splash-screen { position: fixed; top:0; left:0; width: 100%; height: 100%; background: #0a0a0a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; transition: opacity 0.5s; }
        #fingerprint-prompt { font-size: 20px; cursor: pointer; padding: 20px; background: #1f1f1f; border-radius: 50%; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; border: 2px solid #ff9800; text-align: center; transition: 0.3s; }
        #password-box { text-align: center; }
        #passInput { padding: 10px; font-size: 16px; border: 1px solid #444; background: #222; color: #fff; border-radius: 5px; margin-bottom: 10px; text-align: center; outline: none; }
        #authBtn { padding: 10px 20px; background: #ff9800; color: #000; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body class="locked">

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div id="fingerprint-prompt" onclick="showPasswordBox()">👆<br>Tap</div>
        <div id="password-box" class="hidden">
            <input type="password" id="passInput" placeholder="Enter PIN">
            <br>
            <button id="authBtn" onclick="checkPassword()">ENTER</button>
            <div id="errorMsg" class="hidden" style="color:#ff4444; margin-top: 10px;">Wrong PIN!</div>
        </div>
    </div>

    <!-- Video Area -->
    <div id="nowPlayingText">Select a Channel to Play</div>
    <div id="loading-spinner" class="hidden" style="text-align:center; color:#ff9800; margin-bottom:10px;">Loading Player...</div>
    <div id="videoBox">
        <div style="color:#555; text-align:center; padding-top:100px;">Player will load here</div>
    </div>

    <!-- Sections -->
    <h3 onclick="toggleCategory('mksExclusiveList', 'iconPrem')">💎 MKS Premium & Backup <span id="iconPrem">▼</span></h3>
    <div id="mksExclusiveList" class="category-list active"></div>

    <h3 onclick="toggleCategory('mksTvList', 'iconSony')">📺 Sony Channels <span id="iconSony">▼</span></h3>
    <div id="mksTvList" class="category-list"></div>

    <h3 onclick="toggleCategory('mksStarList', 'iconStar')">⭐ Star Channels <span id="iconStar">▼</span></h3>
    <div id="mksStarList" class="category-list"></div>

    <h3 onclick="toggleCategory('fancodeList', 'iconFan')">🏏 Live Matches (Fancode) <span id="iconFan">▼</span></h3>
    <div id="fancodeList" class="category-list"></div>

    <!-- Logic -->
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());

        const SECRET_PIN = "8888"; 
        
        window.showPasswordBox = function() { 
            document.getElementById("fingerprint-prompt").classList.add("hidden"); 
            document.getElementById("password-box").classList.remove("hidden"); 
        };

        window.checkPassword = function() {
            const input = document.getElementById("passInput").value;
            if (input === SECRET_PIN) { 
                document.getElementById("splash-screen").style.opacity = "0"; 
                setTimeout(() => { 
                    document.getElementById("splash-screen").classList.add("hidden"); 
                    document.body.classList.remove("locked"); 
                }, 500); 
            } else { 
                document.getElementById("errorMsg").classList.remove("hidden"); 
                document.getElementById("passInput").value = ""; 
            }
        };

        window.toggleCategory = function(listId, iconId) {
            const list = document.getElementById(listId);
            const icon = document.getElementById(iconId);
            if (!list) return;
            if (list.classList.contains('active')) {
                list.classList.remove('active');
                icon.innerText = "▼";
            } else {
                list.classList.add('active');
                icon.innerText = "▲";
            }
        };

        // Static Exclusives (Removed placeholder.com links to prevent block)
        const topExclusiveChannels = [
            { title: "Willow TV", url: "https://amg01269-amg01269c1-sportstribal-emea-5204.playouts.now.amagi.tv/ts-eu-w1-n2/playlist/amg01269-willowtvfast-willowplus-sportstribalemea/playlist.m3u8", sourceType: "custom" },
            { title: "Ten Cricket HD", url: "https://stream.ottplus.live/live/ten_cricket_hd_abr/live/ten_cricket_hd_720/chunks.m3u8", sourceType: "custom" },
            { title: "Zee Sarthak", url: "https://d1g8wgjurz8via.cloudfront.net/bpk-tv/Zeesarthak/default/devil.mpd", keyId: "ecad0b097b574078a4a1bde24bfdb2e5", key: "568bb13d04db4b738864f6c849474cd5", sourceType: "custom" },
            { title: "Zee TV", url: "https://d1g8wgjurz8via.cloudfront.net/bpk-tv/Zeetv/default/manifest.mpd", keyId: "ed068cf84f0640ccbc7c0e395c0a272e", key: "bb722190f2bb446391020411a7d0828b", sourceType: "custom" },
            { title: "Zee Bollywood", url: "https://d1g8wgjurz8via.cloudfront.net/bpk-tv/Zeebollywood/default/manifest.mpd", keyId: "e61523260c614746b25b9a5523fe9a39", key: "72ddbf37f76f49acbb8e140e7279e7a1", sourceType: "custom" }
        ];

        const backupChannels = [
            { title: "Star Sports 1 HD", url: "https://tv4wav.pages.dev/?app=cricketm3u8&id=110", sourceType: "tv4wap_direct" },
            { title: "Star Sports 1 Hindi", url: "https://tv4wav.pages.dev/?app=crichd&id=starhindi", sourceType: "tv4wap_direct" },
            { title: "Star Sports 2 HD", url: "https://tv4wav.pages.dev/?app=cricketm3u8&id=109", sourceType: "tv4wap_direct" },
            { title: "Sony Ten 1", url: "https://tv4wav.pages.dev/?app=jiohd&id=33722", sourceType: "tv4wap_direct" }
        ];

        // Fetching APIs
        const proxyBase = "https://mkscricket.mks-cricket.workers.dev/"; 
        const sonyJsonUrl = atob('aHR0cHM6Ly9hbGxpbm9uZXJlYm9ybjIub25saW5lL3Nvbnkvc2xpdjMuanNvbg==');
        const starJsonUrl = atob('aHR0cHM6Ly9qdHZ4d2ViLnBhZ2VzLmRldi9qc3RyNHdlYi5qc29u');
        const fancodeJsonUrl = atob('aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL2RvY3Rvci04dHJhbmdlL3p5cGh4OC9yZWZzL2hlYWRzL21haW4vZGF0YS9mYW5jb2RlLmpzb24=');

        Promise.all([
            fetch(proxyBase + "?url=" + encodeURIComponent(sonyJsonUrl)).then(res => res.json()).catch(() => ({})),
            fetch(proxyBase + "?url=" + encodeURIComponent(starJsonUrl)).then(res => res.json()).catch(() => ({})),
            fetch(fancodeJsonUrl).then(res => res.json()).catch(() => ({}))
        ]).then(([sonyData, starData, fancodeData]) => {
            
            const appendChannel = (listId, channelData) => {
                const list = document.getElementById(listId);
                if (list) list.appendChild(createChannelCard(channelData));
            };

            topExclusiveChannels.forEach(ch => appendChannel('mksExclusiveList', ch));
            backupChannels.forEach(ch => appendChannel('mksExclusiveList', ch));

            if (fancodeData && fancodeData.matches) {
                fancodeData.matches.forEach(match => {
                    const isLive = (match.streamingStatus || "").toUpperCase() === "STARTED";
                    if (isLive && match.auto_streams && match.auto_streams.length > 0) {
                        let streamUrl = match.auto_streams[0].url || match.url || match.stream_url || "";
                        let teamName = (match.team && match.team.length == 2) ? `${match.team[0].name} vs ${match.team[1].name}` : match.title;
                        appendChannel('fancodeList', { title: teamName, logo: match.image, url: streamUrl, sourceType: 'custom' });
                    }
                });
            }

            for (const key in sonyData) { 
                let ch = sonyData[key]; if (ch.title || ch.name || ch.channel_name) { ch.sourceType = 'sony'; appendChannel('mksTvList', ch); }
            }
            for (const key in starData) { 
                let ch = starData[key]; if (ch.title || ch.name || ch.channel_name) { ch.sourceType = 'star'; appendChannel('mksStarList', ch); }
            }
        });

        let shakaPlayerInstance = null; 
        let hlsInstance = null;

        function createChannelCard(channel) {
            const chTitle = channel.title || channel.name || channel.channel_name || "MKS SPORTS";
            const chLogo = channel.logo || channel.icon || channel.channel_logo || "";
            const chId = channel.id || channel.channel_id || "";
            const chUrl = channel.m3u8 || channel.url || channel.link || channel.stream_url || "";

            const card = document.createElement('div');
            card.className = 'channel-card';
            
            // SMART LOGO FALLBACK (Agar image block hui toh channel ka pehla letter dikhayega)
            let logoHtml = chLogo 
                ? `<img src="${chLogo}" class="channel-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                   <div style="display:none; color:#ff9800; font-weight:bold; font-size:22px; width:100%; height:100%; align-items:center; justify-content:center;">${chTitle.charAt(0)}</div>` 
                : `<div style="color:#ff9800; font-weight:bold; font-size:22px; width:100%; height:100%; display:flex; align-items:center; justify-content:center;">${chTitle.charAt(0)}</div>`;

            card.innerHTML = `
                <div class="channel-logo-container">${logoHtml}</div>
                <div class="channel-title">${chTitle}</div>
            `;

            card.onclick = () => {
                document.getElementById('nowPlayingText').innerText = chTitle;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
                const vBox = document.getElementById('videoBox');
                document.getElementById('loading-spinner').classList.remove('hidden');
                vBox.innerHTML = "";

                if (shakaPlayerInstance) { shakaPlayerInstance.destroy(); shakaPlayerInstance = null; }
                if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

                setTimeout(() => {
                    document.getElementById('loading-spinner').classList.add('hidden');
                    let baseAttributes = `style="border:none; width:100%; height:100%; display:block;" allow="autoplay; encrypted-media; fullscreen" allowfullscreen="true"`;

                    if (channel.sourceType === 'tv4wap_direct') {
                        vBox.innerHTML = `<div class="ad-warning">📺 MKS BACKUP PLAYER ACTIVE</div><iframe src="${chUrl}" ${baseAttributes}></iframe>`;
                    } 
                    else if (channel.sourceType === 'sony') {
                        vBox.innerHTML = `<div class="ad-warning">📺 MKS TV PLAYER</div><iframe src="https://allinonereborn2.online/sony/ptest1.html?id=${chId}" ${baseAttributes}></iframe>`;
                    } 
                    else if (channel.sourceType === 'star') {
                        let fUrl = chUrl.includes('pind') ? chUrl : (`https://jtvxweb.pages.dev/pind?id=${chId}`);
                        vBox.innerHTML = `<div class="ad-warning">⚠️ TAP FAST 2-3 TIMES ON PLAY BUTTON TO BYPASS ADS</div><iframe src="${fUrl}" ${baseAttributes}></iframe>`;
                    } 
                    else if (channel.sourceType === 'custom' || channel.sourceType === 'fancode') {
                        vBox.innerHTML = `<div class="ad-warning">🔴 MKS SPORTS LIVE</div><video id="nativePlayer" controls autoplay style="width:100%; height:100%; outline:none; background:#000;"></video>`;
                        startNativePlayer(chUrl, channel.keyId, channel.key);
                    }
                }, 100);
            };
            return card;
        }

        async function startNativePlayer(url, keyId, key) {
            const video = document.getElementById('nativePlayer');
            
            // 1. DRM Keys (Zee Sarthak, etc)
            if (keyId && key) {
                shaka.polyfill.installAll();
                shakaPlayerInstance = new shaka.Player(video);
                shakaPlayerInstance.configure({ drm: { clearKeys: { [keyId]: key } } });
                try {
                    await shakaPlayerInstance.load(url);
                    video.play();
                } catch (e) {
                    document.getElementById('videoBox').innerHTML = `<div style="color:red; text-align:center; padding-top:100px;">DRM Error. Link might be expired.</div>`;
                }
            } 
            // 2. M3U8 Links (Willow, Ten Cricket, Fancode) - HLS.JS USE KARENGE (Error free)
            else if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(video);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play();
                    });
                    hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                        if (data.fatal) {
                            document.getElementById('videoBox').innerHTML = `<div style="color:red; text-align:center; padding-top:100px;">Stream Error. Server link offline.</div>`;
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Mobile fallback
                    video.src = url;
                    video.addEventListener('loadedmetadata', function() { video.play(); });
                }
            } 
            // 3. Fallback
            else {
                shaka.polyfill.installAll();
                shakaPlayerInstance = new shaka.Player(video);
                try {
                    await shakaPlayerInstance.load(url);
                    video.play();
                } catch (e) {
                    document.getElementById('videoBox').innerHTML = `<div style="color:red; text-align:center; padding-top:100px;">Stream Error.</div>`;
                }
            }
        }
    </script>
</body>
</html>
