<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKS WEB</title>
    
    <style>
        /* Yeh thoda design hai taaki iframe poori screen cover kare */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Extra scrollbars ko hide karne ke liye */
        }
        
        .my-iframe {
            width: 100%;
            height: 100vh; /* Viewport ki 100% height lega */
            border: none; /* Border hatane ke liye */
        }
    </style>
</head>
<body>

    <!-- Aapki website yahan embed ho rahi hai -->
    <iframe class="my-iframe" src="https://tv4wab.wapka.site/index.html" allowfullscreen></iframe>

</body>
</html>
