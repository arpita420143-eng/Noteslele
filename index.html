<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>MKS SPORTS</title>
<link href="https://cdn.jsdelivr.net/npm/shaka-player@4.11.2/dist/controls.css" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/shaka-player@4.11.2/dist/shaka-player.ui.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#0b0f19;color:#fff;padding-bottom:30px}
a{color:inherit;text-decoration:none}
button{border:0;cursor:pointer;color:#fff;font:inherit}
header{position:sticky;top:0;z-index:10;background:#0f1626;border-bottom:1px solid #1e293b;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:900}.logo span{color:#ff7b3d}
.btn{padding:7px 13px;border-radius:99px;font-size:12px;font-weight:700;background:#1e293b}
.tg{background:#229ED9}.play{background:#ff7b3d;color:#000}
main{max-width:1000px;margin:auto;padding:14px}
.top{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.top input{flex:1;min-width:160px;padding:9px 14px;border-radius:99px;border:1px solid #26334d;background:#131b2e;color:#fff;outline:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:#131b2e;border:1px solid #1e293b;border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#1e293b}
.info{padding:10px;display:grid;gap:6px}.info h3{font-size:14px}.info small{color:#94a3b8;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.live{color:#ff4d63;font-weight:800;font-size:11px}
.modal{position:fixed;inset:0;z-index:50;background:#000d;display:flex;align-items:center;justify-content:center;padding:10px}
.modal[hidden]{display:none}
.box{width:min(850px,100%);background:#131b2e;border-radius:12px;overflow:hidden}
.stage{position:relative;aspect-ratio:16/9;background:#000}
.stage video,.stage iframe,.shaka-video-container{width:100%;height:100%;border:0}
.pmsg{position:absolute;inset:0;display:grid;place-items:center;background:#000c;padding:12px;text-align:center;font-size:13px}.pmsg[hidden]{display:none}
.bar{padding:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.srv.on{background:#ff7b3d;color:#000}
</style>
</head>
<body>
<header>
  <div class="logo"><span>MKS</span> SPORTS</div>
  <div style="display:flex;gap:6px">
    <button class="btn" onclick="loadFeed()">↻ Refresh</button>
    <a class="btn tg" href="https://t.me/MKSsports_3" target="_blank">Telegram</a>
  </div>
</header>

<main>
  <div class="top">
    <input id="q" placeholder="Search match..." oninput="render()">
    <button class="btn play" id="bAll" onclick="setTab('all')">All</button>
    <button class="btn" id="bLive" onclick="setTab('live')">Live</button>
  </div>
  <div id="grid" class="grid">Loading...</div>
</main>

<div id="modal" class="modal" hidden>
  <div class="box">
    <div class="bar"><b id="ptitle">MKS SPORTS</b><button class="btn" onclick="closeP()">✕</button></div>
    <div class="stage">
      <div id="sbox" class="shaka-video-container" data-shaka-player-container>
        <video id="vid" autoplay playsinline data-shaka-player></video>
      </div>
      <iframe id="ifr" allow="autoplay;encrypted-media;fullscreen" allowfullscreen hidden></iframe>
      <div id="pmsg" class="pmsg" hidden></div>
    </div>
    <div class="bar">
      <div id="srvs" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      <a id="ext" class="btn" target="_blank" hidden>Direct ↗</a>
    </div>
  </div>
</div>

<script>
const FEEDS=[
  "https://rjson.snackonline223.workers.dev/events.json",
  "https://sonujson-v5.pages.dev/Data/sports.json",
  "https://sonujson-v7.pages.dev/Data/sports.json"
];
let list=[],tab="all",cur,pl,ui,$=id=>document.getElementById(id);

function setTab(t){
  tab=t;
  $("bAll").className="btn"+(t=="all"?" play":"");
  $("bLive").className="btn"+(t=="live"?" play":"");
  render();
}

function getDrm(o){
  if(!o)return null;
  if(o.clearKeys)return o.clearKeys;
  if(o.drm&&o.drm.clearKeys)return o.drm.clearKeys;
  if(o.drm&&o.drm.keyId&&o.drm.key)return{[o.drm.keyId]:o.drm.key};
  if(o.keyId&&o.key)return{[o.keyId]:o.key};
  if(typeof o.drmLicense=="string"&&o.drmLicense.includes(":")){let p=o.drmLicense.split(":");return{[p[0].trim()]:p[1].trim()}}
  return null;
}

function getStreams(x){
  let a=[],s=new Set(),add=(n,u,d)=>{if(typeof u=="string"&&u.startsWith("http")&&!s.has(u)){s.add(u);a.push({n:n||"Server "+(a.length+1),u:u.trim(),d})}};
  let arr=x.streams||x.channels||x.links||x.servers||[];
  if(Array.isArray(arr))arr.forEach((v,i)=>typeof v=="string"?add("Server "+(i+1),v):add(v.name||v.title,v.url||v.link||v.m3u8||v.mpd||v.stream_url,getDrm(v)));
  add("HD",x.adfree_url||x.dai_url||x.m3u8||x.mpd||x.stream_url||x.url||x.link,getDrm(x));
  if(x.backup_url)add("Backup",x.backup_url,getDrm(x));
  return a;
}

async function loadFeed(){
  $("grid").innerHTML="Loading...";
  for(const u of FEEDS){
    try{
      const r=await fetch(u,{cache:"no-store"});
      if(!r.ok)continue;
      const j=await r.json();
      const raw=Array.isArray(j)?j:(j.events||j.matches||j.data||j.channels||Object.values(j).find(Array.isArray)||[]);
      if(raw.length){
        list=raw.map((x,i)=>{
          let st=getStreams(x);
          let lv=x.is_live||x.live||String(x.status||"").toLowerCase().includes("live")||st.length>0;
          return{i,t:x.title||x.match_name||x.event_name||x.name||"Match "+(i+1),g:x.tournament||x.league||x.event_category||"Sports",img:x.banner||x.poster||x.image||x.thumb||x.src||"",lv,st};
        });
        return render();
      }
    }catch(e){}
  }
  $("grid").innerHTML="Feed load nahi hua. Refresh dabao.";
}

function render(){
  const q=$("q").value.toLowerCase();
  const f=list.filter(m=>(tab!="live"||m.lv)&&(m.t+" "+m.g).toLowerCase().includes(q));
  $("grid").innerHTML=f.length?f.map(m=>`<div class="card" onclick="openP(${m.i})">${m.img?`<img src="${m.img}" onerror="this.remove()">`:""}<div class="info"><h3>${m.t}</h3><small>${m.g}</small><div class="row"><span class="live">${m.lv?"● LIVE":"UPCOMING"}</span><span class="btn play">▶ Watch</span></div></div></div>`).join(""):"Koi match nahi mila.";
}

async function stopV(){
  $("vid").pause();$("vid").removeAttribute("src");
  if(ui){await ui.destroy();ui=null}
  if(pl){await pl.destroy();pl=null}
}

function openP(i){
  cur=list[i];$("ptitle").textContent=cur.t;$("modal").hidden=false;
  if(!cur.st.length){$("srvs").innerHTML="";$("ext").hidden=true;$("pmsg").textContent="Stream available nahi hai";$("pmsg").hidden=false;return}
  $("srvs").innerHTML=cur.st.map((s,k)=>`<button class="btn srv ${k?"":"on"}" onclick="play(${k})">${s.n}</button>`).join("");
  play(0);
}

async function play(k){
  const s=cur.st[k];
  document.querySelectorAll(".srv").forEach((b,i)=>b.classList.toggle("on",i==k));
  $("ext").href=s.u;$("ext").hidden=false;
  await stopV();
  $("pmsg").textContent="Loading...";$("pmsg").hidden=false;
  if(!/\.(m3u8|mpd|mp4)(\?|$)/i.test(s.u)&&/embed|player|\.html|\.php/i.test(s.u)){
    $("sbox").hidden=true;$("ifr").hidden=false;$("ifr").src=s.u;$("pmsg").hidden=true;return;
  }
  $("ifr").hidden=true;$("ifr").src="about:blank";$("sbox").hidden=false;
  if(window.shaka&&shaka.Player.isBrowserSupported()){
    shaka.polyfill.installAll();
    pl=new shaka.Player();
    await pl.attach($("vid"));
    ui=new shaka.ui.Overlay(pl,$("sbox"),$("vid"));
    if(s.d)pl.configure({drm:{clearKeys:s.d}});
    try{await pl.load(s.u);$("pmsg").hidden=true;$("vid").play().catch(()=>{})}
    catch(e){$("pmsg").textContent="Stream error. Dusra server ya Direct link try karo."}
  }else{$("vid").src=s.u;$("pmsg").hidden=true}
}

async function closeP(){
  await stopV();
  $("ifr").src="about:blank";
  $("modal").hidden=true;
}

loadFeed();
</script>
</body>
</html>
